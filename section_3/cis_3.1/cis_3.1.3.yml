---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_3_1_3 }}
    {{ if not .Vars.deb13cis_bluetooth_service }}
      {{ if not .Vars.deb13cis_bluetooth_mask }}
package:
  bluetooth_pkg:
    title: 3.1.3 | Ensure bluetooth services are not in use | pkg removed
    name: bluez
    installed: false
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 3.1.3
      NIST800-53R5:
      - CM-7
      {{ end }}
      {{ if .Vars.deb13cis_bluetooth_mask }}
service:
  bluetooth_service_masked:
    title: 3.1.3 | Ensure bluetooth services are not in use | masked
    name: bluetooth.service
    masked: true
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 3.1.3
      NIST800-53R5:
      - CM-7
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
