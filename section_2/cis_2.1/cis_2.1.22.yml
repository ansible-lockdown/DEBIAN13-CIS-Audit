---

{{ if .Vars.deb13cis_level_1 }}
  {{ if not .Vars.deb13cis_is_mail_server }}
    {{ if .Vars.deb13cis_rule_2_1_22 }}
command:
  mta_listening_port25:
    title: 2.1.22 | Ensure mail transfer agents are configured for local-only mode
    exit-status: 1
    exec: 'ss -lntu | grep -E ":25\s" | grep -E -v "\s(127.0.0.1|\[?::1\]?):25\s"'
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.22
      NIST800-53R5:
      - CM-7
file:
  /etc/postfix/main.cf:
    title: 2.1.22 | Ensure mail transfer agents are configured for local-only mode
    exists: true
    contents:
    - '/^inet_interfaces\s*=\s*loopback-only/'
    - '!/^inet_interfaces\s*=\s*all/'
    - '!/^(?i)inet_interfaces\s*=\s*ipv4/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.22
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
