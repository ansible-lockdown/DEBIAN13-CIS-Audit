---

{{ if .Vars.deb13cis_level_1 }}
  {{ if not .Vars.deb13cis_is_mail_server }}
    {{ if .Vars.deb13cis_rule_2_1_22 }}
command:
  mta_listening_port25:
    title: 2.1.22 | Ensure mail transfer agents are configured for local-only mode
    exit-status: 1
    exec: 'ss -lntu | grep -E ":25\s" | grep -E -v "\s(127.0.0.1|\[?::1\]?):25\s"'
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.22
      NIST800-53R5:
      - CM-7
  mta_postfix_inet_interfaces:
    title: 2.1.22 | Ensure mail transfer agents are configured for local-only mode | postfix
    exec: "if [ -f /etc/postfix/main.cf ]; then grep -E '^\\s*inet_interfaces' /etc/postfix/main.cf || echo 'inet_interfaces not set'; else echo 'postfix not installed'; fi"
    exit-status: 0
    stdout:
    - '/^(postfix not installed|\s*inet_interfaces\s*=\s*loopback-only\s*)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.22
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
