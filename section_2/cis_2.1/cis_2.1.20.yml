---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_2_1_20 }}
    {{ if not .Vars.deb13cis_xinetd_mask }}
package:
  xinetd_pkg:
    title: 2.1.20 | Ensure xinetd services are not in use | pkg removed
    skip: {{ .Vars.deb13cis_xinetd_server }}
    skip-reason: xinetd is required, deb13cis_xinetd_server is true
    name: xinetd
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.20
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.deb13cis_xinetd_mask }}
service:
  xinetd_service_masked:
    title: 2.1.20 | Ensure xinetd services are not in use | masked
    skip: {{ .Vars.deb13cis_xinetd_server }}
    skip-reason: xinetd is required, deb13cis_xinetd_server is true
    name: xinetd.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.20
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
