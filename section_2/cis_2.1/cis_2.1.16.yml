---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_2_1_16 }}
    {{ if not .Vars.deb13cis_telnet_mask }}
package:
  telnet_pkg:
    title: 2.1.16 | Ensure telnet server services are not in use | pkg removed
    skip: {{ .Vars.deb13cis_telnet_server }}
    skip-reason: the telnet server is required, deb13cis_telnet_server is true
    name: telnetd
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.16
      NIST800-53R5: NA
    {{ end }}
    {{ if .Vars.deb13cis_telnet_mask }}
service:
  telnet_service_masked:
    title: 2.1.16 | Ensure telnet server services are not in use | masked
    skip: {{ .Vars.deb13cis_telnet_server }}
    skip-reason: the telnet server is required, deb13cis_telnet_server is true
    name: inetutils-inetd.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.16
      NIST800-53R5: NA
    {{ end }}
  {{ end }}
{{ end }}
