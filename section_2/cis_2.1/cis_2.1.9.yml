---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_2_1_9 }}
    {{ if not .Vars.deb13cis_nfs_mask }}
package:
  nfs_pkg:
    title: 2.1.9 | Ensure network file system services are not in use | pkg removed
    skip: {{ .Vars.deb13cis_nfs_server }}
    skip-reason: the NFS server is required, deb13cis_nfs_server is true
    name: nfs-kernel-server
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.9
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.deb13cis_nfs_mask }}
service:
  nfs_service_masked:
    title: 2.1.9 | Ensure network file system services are not in use | masked
    skip: {{ .Vars.deb13cis_nfs_server }}
    skip-reason: the NFS server is required, deb13cis_nfs_server is true
    name: nfs-server.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.9
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
