---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_2_1_19 }}
    {{ if not .Vars.deb13cis_apache2_mask }}
package:
  apache2_pkg:
    title: 2.1.19 | Ensure web server services are not in use | pkg removed
    skip: {{ .Vars.deb13cis_apache2_server }}
    skip-reason: apache2 is required, deb13cis_apache2_server is true
    name: apache2
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.19
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.deb13cis_apache2_mask }}
service:
  apache2_service_masked:
    title: 2.1.19 | Ensure web server services are not in use | masked
    skip: {{ .Vars.deb13cis_apache2_server }}
    skip-reason: apache2 is required, deb13cis_apache2_server is true
    name: apache2.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.19
      NIST800-53R5:
      - CM-7
  apache2_socket_masked:
    title: 2.1.19 | Ensure web server services are not in use | masked
    skip: {{ .Vars.deb13cis_apache2_server }}
    skip-reason: apache2 is required, deb13cis_apache2_server is true
    name: apache2.socket
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.19
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
