---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_2_1_10 }}
    {{ if not .Vars.deb13cis_nis_mask }}
package:
  ypserv_pkg:
    title: 2.1.10 | Ensure nis server services are not in use | pkg removed
    skip: {{ .Vars.deb13cis_nis_server }}
    skip-reason: the NIS server is required, deb13cis_nis_server is true
    name: ypserv
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.10
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.deb13cis_nis_mask }}
service:
  ypbind_service_masked:
    title: 2.1.10 | Ensure nis server services are not in use | masked
    skip: {{ .Vars.deb13cis_nis_server }}
    skip-reason: the NIS server is required, deb13cis_nis_server is true
    name: ypbind-server.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.10
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
