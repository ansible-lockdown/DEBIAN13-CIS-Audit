---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_2_1_18 }}
    {{ if not .Vars.deb13cis_squid_mask }}
package:
  squid_pkg:
    title: 2.1.18 | Ensure web proxy server services are not in use | pkg removed
    skip: {{ .Vars.deb13cis_squid_server }}
    skip-reason: squid is required, deb13cis_squid_server is true
    name: squid
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.18
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.deb13cis_squid_mask }}
service:
  squid_service_masked:
    title: 2.1.18 | Ensure web proxy server services are not in use | masked
    skip: {{ .Vars.deb13cis_squid_server }}
    skip-reason: squid is required, deb13cis_squid_server is true
    name: squid.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.18
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
