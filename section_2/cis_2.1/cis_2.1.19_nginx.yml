---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_2_1_19 }}
    {{ if not .Vars.deb13cis_nginx_mask }}
package:
  nginx_pkg:
    title: 2.1.19 | Ensure web server services are not in use | pkg removed
    skip: {{ .Vars.deb13cis_nginx_server }}
    skip-reason: nginx is required, deb13cis_nginx_server is true
    name: nginx
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.19
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.deb13cis_nginx_mask }}
service:
  nginx_service_masked:
    title: 2.1.19 | Ensure web server services are not in use | masked
    skip: {{ .Vars.deb13cis_nginx_server }}
    skip-reason: nginx is required, deb13cis_nginx_server is true
    name: nginx.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.19
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
