---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_2_1_2 }}
    {{ if not .Vars.deb13cis_avahi_mask }}
package:
  avahi_pkg:
    title: 2.1.2 | Ensure avahi daemon services are not in use | pkg removed
    skip: {{ .Vars.deb13cis_avahi_server }}
    skip-reason: avahi is required, deb13cis_avahi_server is true
    name: avahi-daemon
    installed: false
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 2.1.2
      NIST800-53R5:
      - SI-4
    {{ end }}
    {{ if .Vars.deb13cis_avahi_mask }}
service:
  avahi_socket_masked:
    title: 2.1.2 | Ensure avahi daemon services are not in use | masked
    skip: {{ .Vars.deb13cis_avahi_server }}
    skip-reason: avahi is required, deb13cis_avahi_server is true
    name: avahi-daemon.socket
    masked: true
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 2.1.2
      NIST800-53R5:
      - SI-4
  avahi_service_masked:
    title: 2.1.2 | Ensure avahi daemon services are not in use | masked
    skip: {{ .Vars.deb13cis_avahi_server }}
    skip-reason: avahi is required, deb13cis_avahi_server is true
    name: avahi-daemon.service
    masked: true
    meta:
      server: 1
      workstation: 2
      CIS_ID:
      - 2.1.2
      NIST800-53R5:
      - SI-4
    {{ end }}
  {{ end }}
{{ end }}
