---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_2_1_12 }}
    {{ if not .Vars.deb13cis_rpc_mask }}
package:
  rpcbind_pkg:
    title: 2.1.12 | Ensure rpcbind services are not in use | pkg removed
    skip: {{ .Vars.deb13cis_rpc_server }}
    skip-reason: rpcbind is required, deb13cis_rpc_server is true
    name: rpcbind
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.12
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.deb13cis_rpc_mask }}
service:
  rpcbind_service_masked:
    title: 2.1.12 | Ensure rpcbind services are not in use | masked
    skip: {{ .Vars.deb13cis_rpc_server }}
    skip-reason: rpcbind is required, deb13cis_rpc_server is true
    name: rpcbind.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.12
      NIST800-53R5:
      - CM-6
      - CM-7
  rpcbind_socket_masked:
    title: 2.1.12 | Ensure rpcbind services are not in use | masked
    skip: {{ .Vars.deb13cis_rpc_server }}
    skip-reason: rpcbind is required, deb13cis_rpc_server is true
    name: rpcbind.socket
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.12
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
