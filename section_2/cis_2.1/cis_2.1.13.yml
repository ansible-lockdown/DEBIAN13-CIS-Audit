---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_2_1_13 }}
    {{ if not .Vars.deb13cis_rsync_mask }}
package:
  rsync_pkg:
    title: 2.1.13 | Ensure rsync services are not in use | pkg removed
    skip: {{ .Vars.deb13cis_rsync_server }}
    skip-reason: rsync is required, deb13cis_rsync_server is true
    name: rsync
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.13
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.deb13cis_rsync_mask }}
service:
  rsync_service_masked:
    title: 2.1.13 | Ensure rsync services are not in use | masked
    skip: {{ .Vars.deb13cis_rsync_server }}
    skip-reason: rsync is required, deb13cis_rsync_server is true
    name: rsync.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.13
      NIST800-53R5:
      - CM-7
  rsync_socket_masked:
    title: 2.1.13 | Ensure rsync services are not in use | masked
    skip: {{ .Vars.deb13cis_rsync_server }}
    skip-reason: rsync is required, deb13cis_rsync_server is true
    name: rsyncd.socket
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.13
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
