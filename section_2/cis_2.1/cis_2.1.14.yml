---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_2_1_14 }}
    {{ if not .Vars.deb13cis_samba_mask }}
package:
  samba_pkg:
    title: 2.1.14 | Ensure samba file server services are not in use | pkg removed
    skip: {{ .Vars.deb13cis_samba_server }}
    skip-reason: samba is required, deb13cis_samba_server is true
    name: samba
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.14
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.deb13cis_samba_mask }}
service:
  samba_service_masked:
    title: 2.1.14 | Ensure samba file server services are not in use | masked
    skip: {{ .Vars.deb13cis_samba_server }}
    skip-reason: samba is required, deb13cis_samba_server is true
    name: smbd.service
    masked: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.14
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
