---

{{ if .Vars.deb13cis_level_2 }}
  {{ if not .Vars.deb13cis_apparmor_disable }}
    {{ if .Vars.deb13cis_rule_1_3_1_3 }}
command:
  apparmor_enf_only:
    title: 1.3.1.3 | Ensure all AppArmor Profiles are enforcing
    exec: |
      apparmor_status 2>/dev/null | awk '
        /profiles are loaded/ {pl=$1}
        /profiles are in complain mode/ {pc=$1}
        /processes are in complain mode/ {qc=$1}
        /processes are unconfined but have a profile defined/ {qu=$1}
        END {
          print "profiles_loaded=" pl+0
          print "profiles_complain=" (pc == "" ? "missing" : pc)
          print "processes_complain=" (qc == "" ? "missing" : qc)
          print "processes_unconfined=" (qu == "" ? "missing" : qu)
        }'
    exit-status: 0
    stdout:
    - '/^profiles_loaded=[1-9]/'
    - '/^profiles_complain=0$/'
    - '/^processes_complain=0$/'
    - '/^processes_unconfined=0$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.3.1.3
      NIST800-53R5: AC-3
    {{ end }}
  {{ end }}
{{ end }}
