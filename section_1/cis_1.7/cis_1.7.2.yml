---

{{ if .Vars.deb13cis_desktop_required }}
  {{ if .Vars.deb13cis_level_1 }}
    {{ if .Vars.deb13cis_rule_1_7_2 }}
file:
  gdm_disable_user_list:
    title: 1.7.2 | Ensure GDM disable-user-list is configured
    path: /etc/dconf/db/{{ .Vars.deb13cis_dconf_db_name }}.d/00-login-screen
    exists: true
    contents:
    - '/^\[org\/gnome\/login-screen\]$/'
    - '/^disable-user-list=true$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.2
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  gdm_disable_user_list_profile:
    title: 1.7.2 | Ensure GDM disable-user-list is configured | profile
    path: /etc/dconf/profile/{{ .Vars.deb13cis_dconf_db_name }}
    exists: true
    contents:
    - '/^user-db:user$/'
    - '/^system-db:{{ .Vars.deb13cis_dconf_db_name }}$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.7.2
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
    {{ end }}
  {{ end }}
{{ end }}
