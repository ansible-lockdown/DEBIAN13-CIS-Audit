---

{{ if .Vars.deb13cis_desktop_required }}
  {{ if .Vars.deb13cis_level_2 }}
    {{ if .Vars.deb13cis_rule_1_7_7 }}
file:
  gdm_xwayland_configured:
    title: 1.7.7 | Ensure Xwayland is configured
    path: /etc/gdm3/custom.conf
    exists: true
    contents:
    - '!/^WaylandEnable\s*=\s*true/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.7.7
      NIST800-53R5: SI-4
    {{ end }}
  {{ end }}
{{ end }}
