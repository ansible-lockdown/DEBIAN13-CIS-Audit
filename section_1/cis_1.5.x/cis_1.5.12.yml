---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_1_5_12 }}
file:
  coredump_storage_conf:
    title: 1.5.12 | Ensure systemd-coredump Storage is configured
    path: /etc/systemd/coredump.conf
    exists: true
    contents:
    - '/^Storage\s*=\s*none\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.12
      NIST800-53R5: CM-6
      CCI: CCI-000366
  {{ end }}
{{ end }}
