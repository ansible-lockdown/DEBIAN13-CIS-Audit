    contents:
    - '/^ProcessSizeMax\s*=\s*0\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.11
      NIST800-53R5: CM-6
      CCI: CCI-000366
  {{ end }}
{{ end }}
