---

{{ if .Vars.deb13cis_level_2 }}
  {{ if .Vars.deb13cis_rule_1_1_1_8 }}
command:
  udf:
    title: 1.1.1.8 | Ensure udf kernel module is not available
    exit-status: 0
    exec: "modprobe -n -v udf | grep -E '(udf|install)'"
    stdout:
    - install /bin/true
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.8
      NIST800-53R5: CM-8
  blacklist_udf:
    title: 1.1.1.8 | Ensure udf kernel module is not available | blacklist
    exit-status: 0
    exec: grep udf /etc/modprobe.d/*.conf
    stdout:
      - '/^([^:]+:)?\s*blacklist\s+udf\b/'
    meta:
      server: 2
      workstation: 2
      CIS_ID: 1.1.1.8
      NIST800-53R5: CM-8
  {{ end }}
{{ end }}
