---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_1_6_4 }}
    {{ if .Vars.deb13cis_disable_dynamic_motd }}
command:
  pam_motd_configured:
    title: 1.6.4 | Ensure pam_motd is configured
    exec: grep -Hs -E '^\s*session\s+(required|optional)\s+pam_motd\.so\b.*\bmotd=/run/motd\.dynamic' /etc/pam.d/sshd /etc/pam.d/login /etc/pam.d/su /etc/pam.d/gdm-password; true
    exit-status: 0
    stdout:
    - '!/pam_motd/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.4
      NIST800-53R5:
      - CM-1
      - CM-3
      - CM-6
    {{ end }}
  {{ end }}
{{ end }}
