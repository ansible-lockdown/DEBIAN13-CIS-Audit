---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_1_6_10 }}
file:
  sshd_banner_perms:
    title: 1.6.10 | Ensure access to sshd warning banner is configured
    path: {{ .Vars.deb13cis_sshd_banner_file }}
    exists: true
    owner: root
    group: root
    mode:
      or:
      - "0644"
      - "0640"
      - "0600"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.10
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
