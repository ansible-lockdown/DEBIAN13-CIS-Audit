---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_1_6_12 }}
command:
  update_notifier_motd_timer:
    title: 1.6.12 | Ensure update-notifier-motd.timer is not in use
    exec: systemctl is-enabled update-notifier-motd.timer 2>/dev/null | grep -c '^enabled' ; true
    exit-status: 0
    stdout:
    - '/^0$/'
    meta:
      server: 1
      workstation: 0
      CIS_ID:
      - 1.6.12
      NIST800-53R5:
      - CM-7
  update_notifier_motd_timer_active:
    title: 1.6.12 | Ensure update-notifier-motd.timer is not in use | not active
    exec: systemctl is-active update-notifier-motd.timer 2>/dev/null | grep -c '^active' ; true
    exit-status: 0
    stdout:
    - '/^0$/'
    meta:
      server: 1
      workstation: 0
      CIS_ID:
      - 1.6.12
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
