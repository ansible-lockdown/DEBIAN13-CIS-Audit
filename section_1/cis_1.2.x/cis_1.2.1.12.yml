---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_1_2_1_12 }}
command:
  apt_allow_insecure_repositories:
    title: 1.2.1.12 | Ensure AllowInsecureRepositories is configured
    exec: apt-config dump Acquire::AllowInsecureRepositories
    exit-status: 0
    stdout:
    - '/^Acquire::AllowInsecureRepositories "0";$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.2.1.12
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
