---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_1_2_1_15 }}
file:
  apt_check_date:
    title: 1.2.1.15 | Ensure Acquire::Check-Date is configured
    path: /etc/apt/apt.conf.d/99-no-insecure-repositories
    exists: true
    contents:
    - '/^Acquire\:\:Check\-Date\s+"true";/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.2.1.15
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
