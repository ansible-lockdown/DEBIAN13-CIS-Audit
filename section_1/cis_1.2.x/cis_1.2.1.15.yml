---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_1_2_1_15 }}
command:
  apt_check_date:
    title: 1.2.1.15 | Ensure Acquire::Check-Date is configured
    exec: apt-config dump Acquire::Check-Date
    exit-status: 0
    stdout:
    - '/^Acquire::Check\-Date "true";$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.2.1.15
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
