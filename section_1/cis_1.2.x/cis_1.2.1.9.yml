---

{{ if .Vars.deb13cis_level_1 }}
    {{ if .Vars.deb13cis_rule_1_2_1_9 }}
command:
  apt_auth_conf:
    title: 1.2.1.9 | Ensure access to files in /etc/apt/sources.list.d are configured
    exec: "find -L /etc/apt/sources.list.d/ -type f \\( ! -user root -o ! -group root -o -perm /0133 \\) 2>/dev/null"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.2.1.9
      NIST800-53R5: NA
  {{ end }}
{{ end }}
