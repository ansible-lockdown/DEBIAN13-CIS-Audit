---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_1_2_1_10 }}
command:
  apt_sources_list_https:
    title: 1.2.1.10 | Ensure repositories are set to https in /etc/apt/sources.list
    exec: grep -Ers -- '^[[:space:]]*deb(-src)?[[:space:]]+http://' /etc/apt/sources.list | wc -l
    exit-status: 0
    stdout:
    - '/^0$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.2.1.10
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
