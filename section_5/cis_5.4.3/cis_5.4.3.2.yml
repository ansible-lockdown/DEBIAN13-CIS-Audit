---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_5_4_3_2 }}
command:
  check_timeout:
    title: 5.4.3.2 | Ensure default user shell timeout is configured
    exec: 'grep TMOUT /etc/profile.d/*.sh /etc/profile /etc/profile.d/*.sh| cut -d ":" -f2'
    exit-status: 0
    stdout:
    - '/^\s*(readonly\s+)?TMOUT/'
    - '/^\s*(readonly\s+|export\s+)?TMOUT=([1-8][0-9]{0,2}|900)$/'
    - '/^\s*export\s+TMOUT\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.3.2
      NIST800-53R5: NA
  {{ end }}
{{ end }}
