---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_5_4_2_2 }}
command:
  gid_0_check:
    title: 5.4.2.2 | Ensure root is the only GID 0 account
    exec: |
      awk -F: '($1 !~ /^(sync|shutdown|halt|operator)$/ && $4 == "0") { if ($1 == "root") r = 1; else print "FAIL: " $1 ":" $4 } END { if (!r) print "FAIL: root primary GID is not 0" }' /etc/passwd
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.2.2
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
