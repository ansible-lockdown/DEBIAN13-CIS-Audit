---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_5_1_4 }}
file:
{{- range glob "/etc/ssh/*_key.pub" }}
  ssh_host_pub_key_{{ . }}:
    title: 5.1.4 | Ensure access to SSH public host key files is configured
    path: {{ . }}
    exists: true
    mode:
      match-regexp: '^0[0246][04][04]$'
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.4
      NIST800-53R5:
      - AC-3
      - MP-2
{{- else }}
  ssh_host_pub_key:
    title: 5.1.4 | Ensure access to SSH public host key files is configured
    path: /etc/ssh
    exists: true
    skip: true
    skip-reason: no SSH public host key files in /etc/ssh
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.4
      NIST800-53R5:
      - AC-3
      - MP-2
{{- end }}
  {{ end }}
{{ end }}
