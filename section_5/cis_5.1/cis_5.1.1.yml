---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_5_1_1 }}
file:
  sshd_config_perms:
    title: 5.1.1 | Ensure access to /etc/ssh/sshd_config is configured
    path: {{ .Vars.deb13cis_sshd_config_file }}
    exists: true
    mode:
      or:
      - "0600"
      - "0400"
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.1
      NIST800-53R5:
      - AC-3
      - MP-2
{{- range glob "/etc/ssh/sshd_config.d/*.conf" }}
  sshd_config_d_perms_{{ . }}:
    title: 5.1.1 | Ensure access to /etc/ssh/sshd_config is configured | config.d
    path: {{ . }}
    exists: true
    mode:
      match-regexp: '^0[0246]00$'
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.1
      NIST800-53R5:
      - AC-3
      - MP-2
{{- else }}
  sshd_config_d_perms:
    title: 5.1.1 | Ensure access to /etc/ssh/sshd_config is configured | config.d
    path: /etc/ssh/sshd_config.d
    exists: true
    skip: true
    skip-reason: no .conf files in /etc/ssh/sshd_config.d
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.1
      NIST800-53R5:
      - AC-3
      - MP-2
{{- end }}
  {{ end }}
{{ end }}
