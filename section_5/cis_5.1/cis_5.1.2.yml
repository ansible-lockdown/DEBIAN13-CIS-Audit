---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_5_1_2 }}
file:
  sshd_config_d_dir:
    title: 5.1.2 | Ensure access to /etc/ssh/sshd_config.d/ directory is configured
    path: /etc/ssh/sshd_config.d
    exists: true
    filetype: directory
    owner: root
    group: root
    mode: "0700"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
