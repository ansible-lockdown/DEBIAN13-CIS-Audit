---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_5_1_3 }}
file:
{{- range glob "/etc/ssh/*_key" }}
  ssh_host_prv_key_{{ . }}:
    title: 5.1.3 | Ensure access to SSH private host key files is configured
    path: {{ . }}
    exists: true
    mode:
      match-regexp: '^0[0246]00$'
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.3
      NIST800-53R5:
      - AC-3
      - MP-2
{{- else }}
  ssh_host_prv_key:
    title: 5.1.3 | Ensure access to SSH private host key files is configured
    path: /etc/ssh
    exists: true
    skip: true
    skip-reason: no SSH private host key files in /etc/ssh
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.3
      NIST800-53R5:
      - AC-3
      - MP-2
{{- end }}
  {{ end }}
{{ end }}
