---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_5_1_18 }}
file:
  sshd_authtries:
    title: 5.1.18 | Ensure sshd MaxAuthTries is configured
    path: {{ .Vars.deb13cis_sshd_config_file }}
    exists: true
    contents:
    - '/(?i)^\s*maxauthtries [1-4]/'
    - '!/(?i)^\s*maxauthtries ([5-9]|[1-9]{2,})/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.18
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
