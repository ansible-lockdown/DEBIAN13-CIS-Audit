---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_5_1_9 }}
file:
  sshd_disableforwarding:
    title: 5.1.9 | Ensure sshd DisableForwarding is enabled
    path: {{ .Vars.deb13cis_sshd_config_file }}
    exists: true
    contents:
    - '/^\s*DisableForwarding yes/'
    - '!/^DisableForwarding no/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.9
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
