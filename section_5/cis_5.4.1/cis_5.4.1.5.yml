---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_5_4_1_5 }}
command:
  inactive_passwd:
    title: 5.4.1.5 | Ensure inactive password lock is configured
    exec: useradd -D | grep INACTIVE
    exit-status: 0
    stdout:
    - '/^INACTIVE=([1-9]|[0-3][0-9]|4[0-5])/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.5
      NIST800-53R5: NA
  inactive_users:
    title: 5.4.1.5 | Ensure inactive password lock is configured
    exec: |
      awk -F':' -v root={{ if .Vars.deb13cis_inactivelock_include_root }}1{{ else }}0{{ end }} '($2 ~ /^\$.+\$/) && (root || $1 != "root") { if ($7 > 45 || $7 < 0) print "User: " $1 " INACTIVE: " $7 }' /etc/shadow
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.5
      NIST800-53R5: NA
  {{ end }}
{{ end }}
