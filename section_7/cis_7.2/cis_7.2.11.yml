---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.run_heavy_tests }}
    {{ if .Vars.deb13cis_rule_7_2_11 }}
command:
  dot_dir_perms:
    title: 7.2.11 | Ensure local interactive user dot directories access is configured | dot directory permissions
    exec: for h in $(grep -E -v '^(root|halt|sync|shutdown)' /etc/passwd | awk -F':' '(!index($7, "sbin/nologin") && $7 != "/bin/nologin" && $7 != "/bin/false") { print $6 }'); do [ -d "$h" ] && find "$h" -type d -name '.*' ! -name .ssh -perm /g=w,o=rwx 2>/dev/null; done | wc -l
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '/^0$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.11
      NIST800-53R5:
      - AC-6
  dot_ssh_dir_perms:
    title: 7.2.11 | Ensure local interactive user dot directories access is configured | ssh directory permissions
    exec: for h in $(grep -E -v '^(root|halt|sync|shutdown)' /etc/passwd | awk -F':' '(!index($7, "sbin/nologin") && $7 != "/bin/nologin" && $7 != "/bin/false") { print $6 }'); do [ -d "$h" ] && find "$h" -type d -name .ssh -perm /g=rwx,o=rwx 2>/dev/null; done | wc -l
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '/^0$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.11
      NIST800-53R5:
      - AC-6
    {{ end }}
  {{ end }}
{{ end }}
