---

{{ if .Vars.deb13cis_level_2 }}
  {{ if .Vars.deb13cis_rule_6_2_3_8 }}
command:
  auditd_locale_cnf:
    title: 6.2.3.8 | Ensure events that modify the system's network environment are collected | conf check
    exec: |
      for p in /etc/network/interfaces /etc/network/interfaces.d /etc/netplan; do
      [ -e "$p" ] || continue
      grep -hs '^-a .*system-locale' /etc/audit/rules.d/*.rules | grep -qE -- "(path|dir)=${p}/?([[:space:]]|$)" || echo "MISSING $p"
      done
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.8
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_locale_live:
    title: 6.2.3.8 | Ensure events that modify the system's network environment are collected | running
    exec: |
      for p in /etc/network/interfaces /etc/network/interfaces.d /etc/netplan; do
      [ -e "$p" ] || continue
      auditctl -l 2>/dev/null | grep system-locale | grep -qE -- "(path|dir)=${p}/?([[:space:]]|$)" || echo "MISSING $p"
      done
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.8
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
