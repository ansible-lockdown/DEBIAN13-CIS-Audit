---

{{ if .Vars.deb13cis_level_2 }}
  {{ if .Vars.deb13cis_rule_6_2_3_22 }}
command:
  auditd_sessions_cnf:
    title: 6.2.3.22 | Ensure session initiation information is collected | conf check
    exec: grep -h session /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/^\s*-a always,exit -F arch=b64 -S all -F path=/var/run/utmp -F perm=wa -k session/'
    - '/^\s*-a always,exit -F arch=b64 -S all -F path=/var/log/wtmp -F perm=wa -k session/'
    - '/^\s*-a always,exit -F arch=b64 -S all -F path=/var/log/btmp -F perm=wa -k session/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.22
      NIST800-53R5:
      - AU-3
  auditd_session_live:
    title: 6.2.3.22 | Ensure session initiation information is collected | running
    exec: auditctl -l | grep session
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -S all -F path=/var/run/utmp -F perm=wa'
    - '-a always,exit -F arch=b64 -S all -F path=/var/log/wtmp -F perm=wa'
    - '-a always,exit -F arch=b64 -S all -F path=/var/log/btmp -F perm=wa'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.22
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
