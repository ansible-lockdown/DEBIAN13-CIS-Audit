---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_6_1_2_6 }}
    {{ if .Vars.deb13cis_remote_log_server }}
command:
  remote_syslog:
    title: 6.1.2.6 | Ensure rsyslog is configured to send logs to a remote log host
    exec: grep -Eh '^[[:space:]]*[^#[:space:]].*(@|target=)' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/^\s*\S+\s+(@@?|.*target="?){{ .Vars.deb13cis_remote_log_host }}/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2.6
      NIST800-53R5:
      - AU-6
    {{ end }}
  {{ end }}
{{ end }}
