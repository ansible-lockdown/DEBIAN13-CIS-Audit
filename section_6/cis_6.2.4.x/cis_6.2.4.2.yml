---

{{ if .Vars.deb13cis_level_2 }}
  {{ if .Vars.deb13cis_rule_6_2_4_2 }}
{{- $auditconf := glob "/etc/audit/auditd.conf" }}
{{- $logfile := "/var/log/audit/audit.log" }}
{{- if $auditconf }}
{{- with readFile "/etc/audit/auditd.conf" | findStringSubmatch `(?m)^\s*log_file\s*=\s*(?P<path>\S+)` | get "path" }}{{ $logfile = . }}{{ end }}
{{- end }}
file:
{{- if not $auditconf }}
  audit_logfile_owner:
    title: 6.2.4.2 | Ensure audit log files owner is configured | auditd.conf
    path: /etc/audit/auditd.conf
    exists: true
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.2
      NIST800-53R5:
      - AU-3
{{- else }}
{{- range glob (printf "%s*" $logfile) }}
  audit_logfile_owner_{{ . }}:
    title: 6.2.4.2 | Ensure audit log files owner is configured
    path: {{ . }}
    exists: true
    owner: root
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.2
      NIST800-53R5:
      - AU-3
{{- else }}
  audit_logfile_owner:
    title: 6.2.4.2 | Ensure audit log files owner is configured
    path: {{ $logfile }}
    exists: true
    skip: true
    skip-reason: no audit log files at {{ $logfile }}
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.2
      NIST800-53R5:
      - AU-3
{{- end }}
{{- end }}
  {{ end }}
{{ end }}
