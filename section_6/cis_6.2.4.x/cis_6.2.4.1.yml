---

{{ if .Vars.deb13cis_level_2 }}
{{ if .Vars.deb13cis_rule_6_2_4_1 }}
command:
  audit_logfile_perms:
    title: 6.2.4.1 | Ensure audit log files mode is configured
    exec: >-
      c=/etc/audit/auditd.conf; [ -f "$c" ] || { echo "$c is missing"; exit 0; }; l=$(awk -F= '/^[[:space:]]*log_file[[:space:]]*=/ {print $2}' "$c" | xargs); find "$(dirname "$l")" -type f -perm /0137
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.1
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
