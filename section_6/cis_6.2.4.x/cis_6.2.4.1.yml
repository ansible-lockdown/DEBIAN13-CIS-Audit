---

{{ if .Vars.deb13cis_level_2 }}
  {{ if .Vars.deb13cis_rule_6_2_4_1 }}
{{- $logfile := "/var/log/audit/audit.log" }}
{{- if glob "/etc/audit/auditd.conf" }}
{{- with readFile "/etc/audit/auditd.conf" | findStringSubmatch `(?m)^\s*log_file\s*=\s*(?P<path>\S+)` | get "path" }}{{ $logfile = . }}{{ end }}
{{- end }}
{{- $logdir := findStringSubmatch `^(?P<dir>.*)/[^/]*$` $logfile | get "dir" }}
command:
  audit_logfile_perms_all:
    title: 6.2.4.1 | Ensure audit log files mode is configured
    exec: find {{ $logdir }} -type f -perm /0137
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.1
      NIST800-53R5:
      - AU-3
file:
  audit_logfile_perms_{{ $logfile }}:
    title: 6.2.4.1 | Ensure audit log files mode is configured
    path: {{ $logfile }}
    exists: true
    mode:
      match-regexp: '^0[0246][04]0$'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.1
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
