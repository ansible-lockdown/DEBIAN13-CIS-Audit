---

{{ if .Vars.deb13cis_level_2 }}
  {{ if .Vars.deb13cis_rule_6_2_4_3 }}
{{- $logfile := "/var/log/audit/audit.log" }}
{{- if glob "/etc/audit/auditd.conf" }}
{{- with readFile "/etc/audit/auditd.conf" | findStringSubmatch `(?m)^\s*log_file\s*=\s*(?P<path>\S+)` | get "path" }}{{ $logfile = . }}{{ end }}
{{- end }}
{{- $logdir := findStringSubmatch `^(?P<dir>.*)/[^/]*$` $logfile | get "dir" }}
command:
  audit_logfile_group_setting:
    title: 6.2.4.3 | Ensure audit log files group owner is configured
    exec: grep log_group /etc/audit/audit* | awk '{ print $NF}'
    exit-status: 0
    stdout:
    - '/^(adm|root)$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.3
      NIST800-53R5:
      - AU-3
  audit_logfile_group_all:
    title: 6.2.4.3 | Ensure audit log files group owner is configured
    exec: find {{ $logdir }} -type f ! -group root ! -group adm
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.3
      NIST800-53R5:
      - AU-3
file:
  audit_logfile_group_{{ $logfile }}:
    title: 6.2.4.3 | Ensure audit log files group owner is configured
    path: {{ $logfile }}
    exists: true
    group:
      or:
      - root
      - adm
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.3
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
