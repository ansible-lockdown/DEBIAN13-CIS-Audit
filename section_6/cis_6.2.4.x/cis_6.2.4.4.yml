---

{{ if .Vars.deb13cis_level_2 }}
  {{ if .Vars.deb13cis_rule_6_2_4_4 }}
command:
  audit_logfile_dir_perms:
    title: 6.2.4.4 | Ensure the audit log file directory mode is configured
    exec: >-
      c=/etc/audit/auditd.conf; [ -f "$c" ] || { echo "$c is missing"; exit 0; }; l=$(awk -F= '/^[[:space:]]*log_file[[:space:]]*=/ {print $2}' "$c" | xargs); find "$(dirname "$l")" -maxdepth 0 -type d -perm /0027
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.4
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
