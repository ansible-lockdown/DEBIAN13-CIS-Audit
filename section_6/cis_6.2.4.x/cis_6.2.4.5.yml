---

{{ if .Vars.deb13cis_level_2 }}
  {{ if .Vars.deb13cis_rule_6_2_4_5 }}
file:
{{- range glob "/etc/audit/*.conf" "/etc/audit/*.rules" "/etc/audit/*/*.conf" "/etc/audit/*/*.rules" }}
  audit_conf_perms_{{ . }}:
    title: 6.2.4.5 | Ensure audit configuration files mode is configured
    path: {{ . }}
    exists: true
    mode:
      match-regexp: '^0[0246][04]0$'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.5
      NIST800-53R5:
      - AU-3
{{- else }}
  audit_conf_perms:
    title: 6.2.4.5 | Ensure audit configuration files mode is configured
    path: /etc/audit/auditd.conf
    exists: true
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.4.5
      NIST800-53R5:
      - AU-3
{{- end }}
  {{ end }}
{{ end }}
